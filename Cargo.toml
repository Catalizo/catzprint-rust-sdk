[package]
name = "catzprint"
version = "2.2.1"
edition = "2021"
description = "Official Rust SDK for the CatzPrint cloud printing API"
license = "MIT"
authors = ["Catalizo"]
repository = "https://github.com/Catalizo/catzprint-rust"
homepage = "https://catzprint.com"
documentation = "https://docs.rs/catzprint"
readme = "README.md"
keywords = ["printing", "receipt", "escpos", "api", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*", "examples/**/*", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]
rust-version = "1.82"

[features]
default = ["sealed", "local"]
## Client-side sealing (NaCl sealed box) of job content to the server key.
sealed = ["dep:crypto_box", "dep:curve25519-dalek"]
## A synchronous client built on reqwest::blocking.
blocking = ["reqwest/blocking"]
## Local (offline) printing through CatzPrint stations on the same network:
## local modes, token minting and caching, TLS pinning, mDNS discovery.
local = [
    "dep:rustls",
    "dep:webpki-roots",
    "dep:http-body",
    "dep:bytes",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
fastrand = "2"
crypto_box = { version = "0.9", features = ["seal"], optional = true }
# Already in the tree through crypto_box: rejects small-order X25519 keys.
curve25519-dalek = { version = "4.1", default-features = false, optional = true }
# Already in the dependency tree through reqwest's rustls-tls (same versions);
# used directly for station certificate pinning.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# Already in the tree through reqwest: a request body that records when it
# has been handed to the connection (did a station get the whole request?).
http-body = { version = "1", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "print_receipt"

[[example]]
name = "print_pdf_and_wait"

[[example]]
name = "verify_webhook"

[[example]]
name = "local_hub"
required-features = ["local"]
